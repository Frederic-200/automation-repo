name: Daily FredsDesk News

on:
  push:                    # main trigger: the daily Claude news task pushes news/queue/<date>-slug.json
    branches: [main]
    paths: ["news/queue/*.json"]
  schedule:
    - cron: "37 21 * * *"  # backup: 21:37 UTC = 05:37 Philippine time (off the hour on purpose)
  workflow_dispatch:
    inputs:
      file:
        description: "Script to build, e.g. news/queue/2026-10-10-slug.json (default: today's script)"
        required: false
      upload:
        description: "Upload to Google Drive"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm ci --no-audit --no-fund

      - name: Cache voice model
        id: models
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0-int8

      - name: Download voice model (first run only)
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -fL -o models/kokoro-v1.0.int8.onnx $base/kokoro-v1.0.int8.onnx
          curl -fL -o models/voices-v1.0.bin $base/voices-v1.0.bin

      - name: Build news video (and upload to Drive)
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          IN_FILE: ${{ github.event.inputs.file }}
          IN_UPLOAD: ${{ github.event.inputs.upload }}
        run: |
          args=""
          if [ -n "$IN_FILE" ]; then args="$args --file $IN_FILE"; fi
          if [ "$IN_UPLOAD" = "false" ]; then args="$args --no-upload --no-log"; fi
          python3 engine/news_daily.py $args

      - name: Keep a 7-day backup copy
        uses: actions/upload-artifact@v4
        with:
          name: news-video
          path: output/*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Log news as covered
        run: |
          git config user.name "fredsdesk-bot"
          git config user.email "fredsdesk-bot@users.noreply.github.com"
          git add -A news
          git diff --cached --quiet || (git commit -m "News published: update covered log" && git pull --rebase --autostash origin main && git push)
