name: Render daily AI short

on:
  push:
    paths:
      - "queue/*.json"
  workflow_dispatch:
    inputs:
      script:
        description: "Script file to render (default: newest in queue/)"
        required: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Pick script
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Render exactly the script added or changed in this push.
            f="$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'queue/*.json' | sort | tail -n 1)"
            if [ -z "$f" ]; then
              echo "No new script in this push; nothing to render."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            f="${{ github.event.inputs.script }}"
            if [ -z "$f" ]; then f="$(ls queue/*.json | sort | tail -n 1)"; fi
          fi
          echo "Rendering: $f"
          echo "file=$f" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$f" .json)" >> "$GITHUB_OUTPUT"
          echo "title=$(python -c "import json,sys;print(json.load(open('$f'))['title'])")" >> "$GITHUB_OUTPUT"

      - name: Render video
        if: steps.pick.outputs.skip != 'true'
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/render.py "${{ steps.pick.outputs.file }}" --out output/video.mp4

      - name: Upload to Google Drive
        if: steps.pick.outputs.skip != 'true'
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/upload_drive.py output/video.mp4 "${{ steps.pick.outputs.name }} - ${{ steps.pick.outputs.title }}.mp4"

      - name: Keep a copy as a build artifact (backup)
        if: steps.pick.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ steps.pick.outputs.name }}
          path: output/video.mp4
          retention-days: 7
