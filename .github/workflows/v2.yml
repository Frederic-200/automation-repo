name: FredsDesk v2 video
# Renders ONE v2 script (shorts/v2/queue/*.json) and uploads it to Drive ("FredsDesk v2" folder). Manual start only for now: there is NO schedule,
# so enabling the daily flow later is a separate, explicit step. Does not touch loops, shorts, news or lessons.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Path of the v2 script, e.g. shorts/v2/queue/2026-11-10-slug.json"
        required: true
      upload:
        description: "Upload to Google Drive (false = keep the mp4 as a workflow artifact only)"
        default: "true"
      skip_novelty:
        description: "Skip the novelty (too-similar) check"
        default: "false"

concurrency:
  group: fredsdesk-v2
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fluidsynth fluid-soundfont-gm

      - name: Install Python dependencies
        run: pip install numpy scipy pillow soundfile mido kokoro-onnx sherpa-onnx google-api-python-client google-auth

      - name: Install Node packages
        run: npm ci --no-audit --no-fund

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium (first run / after upgrades)
        run: npx playwright-core install --with-deps chromium

      - name: Cache voice models
        uses: actions/cache@v4
        with:
          path: ~/.cache/video-kit/models
          key: video-kit-models-v1

      - name: Fetch voice and alignment models (if not cached)
        run: |
          M=~/.cache/video-kit/models; mkdir -p "$M"; cd "$M"
          B=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          for m in kokoro-v1.0.int8.onnx voices-v1.0.bin; do [ -s "$m" ] || curl -fsSL --retry 3 -o "$m" "$B/$m"; done
          if [ ! -d sherpa-onnx-streaming-zipformer-en-2023-06-26 ]; then
            curl -fsSL --retry 3 -o asr.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-en-2023-06-26.tar.bz2
            tar xjf asr.tar.bz2 && rm asr.tar.bz2
          fi
          ls -la "$M"

      - name: Kit setup (soundfont, fonts, checks)
        run: bash shorts/kit/scripts/setup.sh

      - name: Render (and upload to Drive)
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          VIDEO_KIT_CACHE: /home/runner/.cache/video-kit
          IN_SCRIPT: ${{ github.event.inputs.script }}
          IN_UPLOAD: ${{ github.event.inputs.upload }}
          IN_SKIP: ${{ github.event.inputs.skip_novelty }}
        run: |
          args=""
          if [ "$IN_UPLOAD" = "false" ]; then args="$args --no-upload"; fi
          if [ "$IN_SKIP" = "true" ]; then args="$args --skip-novelty"; fi
          set +e
          python3 shorts/v2/run_daily.py "$IN_SCRIPT" --out /tmp/v2-out $args 2>&1 | tee /tmp/v2.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then echo "::error title=v2 render failed (exit $rc)::$(tail -c 900 /tmp/v2.log | tr '\n' '|' | sed 's/%/%25/g')"; fi
          exit $rc

      - name: Keep the video as a workflow artifact (always, 7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-video
          path: /tmp/v2-out/*.mp4
          retention-days: 7
          if-no-files-found: ignore
