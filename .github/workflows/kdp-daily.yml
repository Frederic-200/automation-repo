name: Daily KDP book

on:
  schedule:
    - cron: "43 17 * * *"   # 17:43 UTC = 01:43 Philippine time (off the hour: GitHub drops on-the-hour jobs under load)
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to Google Drive"
        type: boolean
        default: true
      force:
        description: "Make a book even if one was already made today"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: kdp-daily
  cancel-in-progress: false

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system tools and fonts
        run: |
          sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config fontconfig
          mkdir -p ~/.fonts && cp kdp/fonts/*.ttf ~/.fonts/ && fc-cache -f

      - name: Install dependencies
        run: pip install -r kdp/requirements.txt

      - name: Build book (and upload to Drive)
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          KDP_DAILY_FOLDER_ID: ${{ vars.KDP_DAILY_FOLDER_ID }}
          KDP_TRACKER_ID: ${{ vars.KDP_TRACKER_ID }}
        run: |
          args=""
          if [ "${{ github.event.inputs.upload }}" = "false" ]; then args="$args --no-upload --no-log"; fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then args="$args --force"; fi
          python3 kdp/engine/daily.py $args

      - name: Keep a 7-day backup copy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kdp-book
          path: |
            kdp/output/*/interior.pdf
            kdp/output/*/cover.pdf
            kdp/output/*/listing.md
            kdp/output/*/contact_sheet.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Log book and move theme to done
        run: |
          git config user.name "tinycomet-bot"
          git config user.email "tinycomet-bot@users.noreply.github.com"
          git add -A kdp/catalog.json kdp/themes
          git diff --cached --quiet || (git commit -m "KDP book made: update catalog" && git pull --rebase --autostash origin main && git push)
